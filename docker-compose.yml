services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: landslide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-landslide_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-landslide_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - landslide-network

  backend:
    build:
      context: "./src/Backend/node-server"
      dockerfile: Dockerfile
    container_name: landslide-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-landslide_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      AIML_API_KEY: ${AIML_API_KEY:-aiml_shared_secret_key}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    networks:
      - landslide-network

  frontend:
    build:
      context: "./src/Frontend"
      dockerfile: Dockerfile
    container_name: landslide-frontend
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - landslide-network

volumes:
  postgres_data:

networks:
  landslide-network:
    driver: bridge
