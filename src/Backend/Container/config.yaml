# ──────────────────────────────────────────────────────────────────────────────
# Landslide Risk Monitoring -- Configuration
# ──────────────────────────────────────────────────────────────────────────────

# ── Region Definitions ────────────────────────────────────────────────────────
# List of rectangle geometries. The pipeline pulls data for ALL regions and
# merges them into a single output CSV. Add/remove rectangles freely.
# In future, the frontend will generate this list from a map UI.
regions:
  - name: "Shillong, Meghalaya"
    bbox:
      min_lat: 25.20
      max_lat: 25.75
      min_lon: 91.55
      max_lon: 92.05
    grid_resolution_km: 1.0

  - name: "Aizawl, Mizoram"
    bbox:
      min_lat: 23.55
      max_lat: 23.95
      min_lon: 92.55
      max_lon: 92.85
    grid_resolution_km: 1.0

  # ── Add more rectangles below ──
  # - name: "Kohima, Nagaland"
  #   bbox:
  #     min_lat: 25.60
  #     max_lat: 25.72
  #     min_lon: 94.05
  #     max_lon: 94.15
  #   grid_resolution_km: 1.0

# ── Google Earth Engine ───────────────────────────────────────────────────────
gee:
  project_id: "alphazero-506716"
  # For service account auth (unattended runs), uncomment and set:
  # credentials_path: "path/to/service-account-key.json"

# ── Schedule ──────────────────────────────────────────────────────────────────
schedule:
  timezone: "Asia/Kolkata"
  interval_hours: 4            # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 IST
  periodic_refresh_days: 7     # Tier 2 (NDVI, vegetation) refresh interval

# ── Earthquake API ────────────────────────────────────────────────────────────
earthquake:
  min_magnitude: 2.5
  lookback_days: 90
  max_radius_km: 200

# ── Output ────────────────────────────────────────────────────────────────────
output:
  directory: "data"
  filename: "output.csv"

# ── Server Push ───────────────────────────────────────────────────────────────
# Endpoint that receives POST requests with prediction results.
server:
  url: "https://land-slide-sih26.onrender.com/api/map/national"
  # Optional API key for Authorization header (leave empty if not required)
  api_key: ""
